services:
  nginx:
    image: nginx:alpine
    container_name: yt-summarizer-nginx
    ports:
      - "8500:80"
    volumes:
      - ./pwa:/app/pwa
      - ./pwa/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - youtube-summarizer
    restart: unless-stopped

  youtube-summarizer:
    build: .
    container_name: youtube-summarizer
    expose:
      - "8501"
    volumes:
      - ./config.py:/app/config.py
      - ./pwa:/app/pwa
    env_file:
      - .env
    restart: unless-stopped
