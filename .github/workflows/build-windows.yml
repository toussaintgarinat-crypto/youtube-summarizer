name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # required to publish releases

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Create .env
        shell: bash
        run: echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" > .env

      - name: Build EXE
        run: pyinstaller gui-windows.spec --noconfirm

      - name: Zip build
        shell: pwsh
        run: Compress-Archive -Path dist/YouTubeSummarizer -DestinationPath YouTubeSummarizer-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeSummarizer-Windows
          path: YouTubeSummarizer-Windows.zip
          retention-days: 30

      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: YouTubeSummarizer-Windows.zip
