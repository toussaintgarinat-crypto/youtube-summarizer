name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install youtube-transcript-api tiktoken python-dotenv requests fpdf2 openai yt-dlp

      - name: Create .env
        shell: bash
        run: echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" > .env

      - name: Build EXE
        run: pyinstaller gui-windows.spec --noconfirm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeSummarizer-Windows
          path: dist/YouTubeSummarizer/
          retention-days: 30
