name: Build Mac DMG

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # required to publish releases

jobs:
  build-arm:
    name: Build (Apple Silicon M1-M5)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Create .env
        run: echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" > .env

      - name: Build app
        run: pyinstaller gui.spec --noconfirm

      - name: Create DMG
        run: |
          hdiutil create \
            -volname "YouTubeSummarizer" \
            -srcfolder dist/YouTubeSummarizer.app \
            -ov -format UDZO \
            dist/YouTubeSummarizer.dmg

      - name: Upload DMG (Apple Silicon M1-M5)
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeSummarizer-Mac-AppleSilicon-M1-M2-M3-M4-M5
          path: dist/YouTubeSummarizer.dmg
          retention-days: 30

      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/YouTubeSummarizer.dmg

  build-intel:
    name: Build (Mac Intel x86_64)
    runs-on: macos-13

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Create .env
        run: echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" > .env

      - name: Build app
        run: pyinstaller gui-intel.spec --noconfirm

      - name: Create DMG
        run: |
          hdiutil create \
            -volname "YouTubeSummarizer" \
            -srcfolder dist/YouTubeSummarizer.app \
            -ov -format UDZO \
            dist/YouTubeSummarizer-Intel.dmg

      - name: Upload DMG (Intel x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeSummarizer-Mac-Intel
          path: dist/YouTubeSummarizer-Intel.dmg
          retention-days: 30

      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/YouTubeSummarizer-Intel.dmg
